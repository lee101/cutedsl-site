[Unit]
# The cold Python worker delegates Z-Image requests to the native gateway.
# Start both together so a standalone inference restart or host boot cannot
# leave :8100 healthy-looking while its only active image backend is absent.
# The request-level restart grace below covers the native model's readiness
# interval after systemd has spawned it.
Wants=nvidia-persistenced.service omniserve-native.service
After=nvidia-persistenced.service omniserve-native.service

[Service]
ExecStartPre=/bin/bash /nvme0n1-disk/code/cutedsl-site/inference/wait_for_cuda.sh
Environment=ZIMAGE_TEXT_ENCODER_DEVICE=cpu
# Keep latent teleport as a cold fallback cache only; primary image path is
# omniserve-native embedded Z-Image. Cap RAM so this worker does not refill swap.
Environment=LATENT_TELEPORT_MAX_ENTRIES_PER_RESOLUTION=256
Environment=LATENT_TELEPORT_MAX_GIB_PER_RESOLUTION=1
Environment=LATENT_TELEPORT_PRUNE_INTERVAL_SECONDS=60
Restart=always
RestartSec=5s

# Batch capacity is decided against brokered headroom rather than device-wide
# free memory, which on a shared GPU is another tenant's number as much as ours.
# Unset or unreachable falls back to the cudaMemGetInfo path.
Environment=ZIMAGE_VRAM_BROKER_URL=http://127.0.0.1:8791
# When the BF16 worker is cold, prefer omniserve-native's already-resident
# quantized Z-Image backend. The warm BF16 path is unchanged.
Environment=ZIMAGE_NATIVE_FALLBACK_URL=http://127.0.0.1:8791
Environment=ZIMAGE_NATIVE_FALLBACK_RETRIES=1
# Never answer native capacity pressure by loading a duplicate BF16 pipeline.
# Checkpoint loading can starve the HTTP event loop and make /healthz time out.
Environment=ZIMAGE_LOCAL_COLD_FALLBACK_ENABLED=0
# Video and other managed GPU tenants can briefly occupy the native image
# backend's 4 GiB scratch floor. Queue that exact capacity response within the
# public edge's 120-second response budget, leaving room for generation/upload.
Environment=ZIMAGE_NATIVE_HEADROOM_GRACE_SECONDS=60
Environment=ZIMAGE_NATIVE_HEADROOM_POLL_SECONDS=2
# Background farms retry durably outside the request. Release the single image
# lane quickly under capacity pressure instead of hiding paid traffic behind a
# 60-second background wait.
Environment=ZIMAGE_NATIVE_BACKGROUND_HEADROOM_GRACE_SECONDS=5
# The native library can cross its admission threshold and then lose CUDA
# scratch space to another managed tenant mid-generation. It exposes that race
# as this single opaque HTTP 500, so retain the paid request through the same
# bounded recovery budget instead of spending one 100ms generic retry.
Environment=ZIMAGE_NATIVE_GENERATION_FAILURE_GRACE_SECONDS=60
Environment=ZIMAGE_NATIVE_GENERATION_FAILURE_POLL_SECONDS=2
# A native fatal assertion is restarted by systemd, but reloading the embedded
# diffusion model can take about two minutes. Bound each paid request below
# the edge timeout; a later client retry can observe the completed restart.
Environment=ZIMAGE_NATIVE_RESTART_GRACE_SECONDS=60
Environment=ZIMAGE_NATIVE_RESTART_POLL_SECONDS=2
# The configured fal.ai account is locked for exhausted balance. Do not turn a
# retryable local capacity failure into a guaranteed external 403/503.
Environment=ZIMAGE_FAL_FALLBACK_ENABLED=0
Environment=ZIMAGE_NATIVE_FAILURE_COOLDOWN_SECONDS=30
# Keep heavyweight LoRA training out of the public inference process. RunPod
# remains available through /train/from_urls when configured.
Environment=LOCAL_GPU_TRAINING_ENABLED=0
Environment=LOCAL_TRAINING_MAX_CONCURRENT=1
# NSFW classification is small and latency-tolerant. CPU placement avoids a
# racy CUDA load on this shared GPU when only a few MiB remain free.
Environment=NSFW_DEVICE=cpu

# The host credential file also serves unrelated sites and exports a generic
# R2_BUCKET. Keep generated CuteDSL URLs and their actual bucket in lockstep.
Environment=CUTEDSL_R2_BUCKET=appstatic
Environment=CUTEDSL_R2_BUCKET_PATH=cutedsl/uploads
Environment=CUTEDSL_R2_PUBLIC_BASE_URL=appstatic.app.nz
