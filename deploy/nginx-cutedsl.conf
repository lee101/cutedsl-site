upstream cutedsl_backend {
    server 127.0.0.1:8090;
}

server {
    listen 80;
    listen 443 ssl;
    server_name cutedsl.app.nz cutedsl.cc www.cutedsl.cc;
    ssl_certificate /etc/nginx/ssl/app.nz.crt;
    ssl_certificate_key /etc/nginx/ssl/app.nz.key;

    client_max_body_size 50M;
    proxy_read_timeout 600s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;

    location /api/ {
        proxy_pass http://cutedsl_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;

        proxy_intercept_errors on;
        error_page 502 = @api_502;
        error_page 503 = @api_503;
        error_page 504 = @api_504;
    }

    location / {
        proxy_pass http://cutedsl_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
    }

    location @api_502 {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 502 '{"error":"api gateway unavailable","status":502}';
    }

    location @api_503 {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"api service unavailable","status":503}';
    }

    location @api_504 {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 504 '{"error":"api gateway timeout","status":504}';
    }

    access_log /var/log/nginx/cutedsl.app.nz.access.log;
    error_log /var/log/nginx/cutedsl.app.nz.error.log;
}
