[program:cutedsl-gallery-generator]
directory=/nvme0n1-disk/code/cutedsl-site
command=/bin/bash -lc 'set -a; [ -f /opt/cutedsl-site/.env ] && source /opt/cutedsl-site/.env; set +a; export GEN_BACKEND=local INFERENCE_BACKEND_URL=http://127.0.0.1:8100 GO_SERVER_URL=http://127.0.0.1:8095; exec nice -n 10 ionice -c2 -n7 /nvme0n1-disk/code/.venv/bin/python scripts/generate_images.py --limit 0'
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=420
stopsignal=TERM
user=administrator
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/nvme0n1-disk/tmp/cutedsl-gallery-generator.log
stderr_logfile=/nvme0n1-disk/tmp/cutedsl-gallery-generator.err
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile_backups=3
