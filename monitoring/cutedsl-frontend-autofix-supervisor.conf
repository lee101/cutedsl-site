[program:cutedsl-frontend-autofix]
directory=/nvme0n1-disk/code/cutedsl-site
command=/nvme0n1-disk/code/cutedsl-site/monitoring/cutedsl_frontend_autofix_monitor.sh
autostart=true
autorestart=true
user=administrator
stdout_logfile=/var/log/supervisor/cutedsl-frontend-autofix.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/cutedsl-frontend-autofix.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=HOME="/home/administrator",PATH="/home/administrator/.bun/bin:/home/administrator/.local/bin:/nvme0n1-disk/code/.venv/bin:/usr/local/bin:/usr/bin:/bin"
